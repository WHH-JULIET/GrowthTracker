<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Growth Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <div class="eyebrow">Daily Growth Tracker</div>
          <h1>Build the day you want</h1>
          <p class="sub">Log goals, people, phone time, food, sports. Get a focused improvement summary.</p>
        </div>
        <div id="authBar" class="auth-bar"></div>
      </header>

      <!-- Login / Register wall -->
      <div id="loginWall" class="login-wall" style="display:none;">
        <div class="card login-card">
          <div class="login-brand">
            <div class="login-icon">🌱</div>
            <h2>Growth Tracker</h2>
            <p>Your private daily progress journal</p>
          </div>

          <div class="login-tabs">
            <button id="tabLogin" class="tab active" type="button">Sign In</button>
            <button id="tabRegister" class="tab" type="button">Register</button>
          </div>

          <form id="loginForm">
            <label>Username<input type="text" id="loginUsername" autocomplete="username" placeholder="Enter your username" /></label>
            <label>PIN<input type="password" id="loginPin" inputmode="numeric" maxlength="10" placeholder="Enter your PIN" /></label>
            <p id="loginError" class="form-error" style="display:none;">⚠️ </p>
            <button type="submit">Sign In →</button>
          </form>

          <form id="registerForm" style="display:none;">
            <label>Username<input type="text" id="regUsername" autocomplete="username" placeholder="Choose a username" /></label>
            <label>PIN<input type="password" id="regPin" inputmode="numeric" maxlength="10" placeholder="Choose a PIN (min 4 digits)" /></label>
            <p id="registerError" class="form-error" style="display:none;">⚠️ </p>
            <button type="submit">Create Account →</button>
          </form>
        </div>
      </div>

      <!-- Main app -->
      <main class="content" id="mainContent" style="display:none;">
        <section class="card form-card">
          <h2>New Entry</h2>
          <form id="entryForm">
            <label>
              Date
              <input type="date" name="date" id="dateInput" value="{{ today }}" />
            </label>
            <label>
              Goals
              <textarea name="goals" rows="3" placeholder="Top 1-3 goals (or nil)" required></textarea>
            </label>
            <label>
              People Involved in My Life
              <textarea name="people_involved" rows="3" placeholder="People you interacted with today (or nil)" required></textarea>
            </label>
            <label>
              Phone Time (min)
              <input type="number" name="phone_minutes" min="0" placeholder="0" />
            </label>
            <label>
              Food Items
              <textarea name="food" rows="2" placeholder="Meals/snacks (or nil)" required></textarea>
            </label>
            <label>
              Sports/Activity
              <textarea name="sports" rows="2" placeholder="Sports or workout (or nil)" required></textarea>
            </label>
            <label class="toggle">
              <input type="checkbox" name="has_medicines" id="hasMedicinesCheck" />
              I have prescribed medicines
            </label>
            <label class="toggle" id="medicinesTakenRow" style="display:none;">
              <input type="checkbox" name="medicines_taken" />
              Medicines taken today
            </label>
            <button type="submit">Save Entry</button>
          </form>
        </section>

        <section class="card summary-card">
          <div class="summary-header">
            <h2>Latest Entry</h2>
            <button id="loadLast" type="button">Load Last</button>
          </div>
          <div id="summaryContent" class="summary-content">
            <p class="placeholder">No entries yet.</p>
          </div>
        </section>

        <section class="card history-card">
          <h2>History</h2>
          <div id="historyList" class="history-list"></div>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
